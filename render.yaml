services:
  - type: web
    name: expensio-app
    env: node
    rootDir: backend
    buildCommand: npm install && npm run render-postbuild
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false # User must input this in the Render dashboard
